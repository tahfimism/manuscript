            "...And so I choose the unknown,<br/>
            A Home I carve for myself alone."<span class="ink-rest-dot" title="fountain pen ink rest dot" aria-hidden="true"></span>
          </p>

          <!-- Architectural Line-Art: Wooden Door Ajar with Morning Sunbeam -->
          <svg viewBox="0 0 100 130" style="margin: 2.2rem auto 1.5rem; display: block; width: 88px;" aria-hidden="true">

            <line x1="60" y1="125" x2="72" y2="130" stroke="#3C2A1E" stroke-width="0.6" opacity="0.3"/>

            </g>

          <span class="poem__sig" style="margin: 1.2rem auto 0; text-align: center; color: #6B5340;">tai khan</span>
