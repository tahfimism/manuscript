  <div class="poem__scene" aria-hidden="true"><img src="../assets/img/svg/scene-cupcake.svg" alt="" /></div>
  <article class="poem">
    <div class="poem-card" data-edge="torn">
      <div class="poem__chapter">№ 07 &nbsp;·&nbsp; Memoirs</div>
      <h1 class="poem__title poem__title--script">Memoirs</h1>
      <p class="poem__sub">nurture the soul, find the freedom</p>

      <div class="poem__body">
        <p class="stanza verse--script verse--center">Mighty dreams within,<br/>
        Underneath the memoirs,<br/>
        For a new beginning,<br/>
        For thoughts to release.</p>

        <svg class="stanza-divider" viewBox="0 0 60 8" aria-hidden="true">
          <path d="M 2 4 Q 15 0 30 4 T 58 4" stroke="#D04848" stroke-width="0.8" fill="none" opacity="0.5"/>
        </svg>

        <p class="stanza">In the landscape, over the horizon,<br/>
        Nurture the soul, find the freedom.</p>

        <span class="poem__sig">tai khan</span>
      </div>

      <nav class="poem__nav">

    </div>
  </article>
