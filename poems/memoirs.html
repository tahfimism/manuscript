          <line x1="62" y1="98" x2="68" y2="143" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
          <line x1="80" y1="98" x2="80" y2="144" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
          <line x1="98" y1="98" x2="92" y2="143" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
          <path d="M 38 90 Q 38 68 58 68 Q 65 52 82 54 Q 98 48 112 60 Q 126 62 124 82 Q 126 92 115 92 L 45 92 Z" fill="#FFF2EB" stroke="#D8334A" stroke-width="1.5"/>

          <circle cx="80" cy="38" r="8" fill="#D8334A"/>

        </svg>
      </div>

      <div class="poem__chapter">№ 07 &nbsp;·&nbsp; Memoirs</div>
      <h1 class="poem__title poem__title--script" style="transform: rotate(-2deg); color: #D81E34;">Memoirs</h1>
      <p class="poem__sub" style="color: #A05858; font-family: 'Caveat', cursive; font-size: 1.15rem;">nurture the soul, find the freedom</p>

      <div class="poem__body">
        <p class="stanza">Mighty dreams within,<br/>
        Underneath the <span class="pen-underline">memoirs</span>,<br/>
        For a new beginning,<br/>
        For thoughts to release.</p>

        <svg class="stanza-divider" viewBox="0 0 60 8" width="60" height="8" style="width: 60px; height: 8px; margin: 1.6rem auto;" aria-hidden="true">
          <path d="M 2 4 Q 15 0 30 4 T 58 4" stroke="#D8334A" stroke-width="0.8" fill="none" opacity="0.5"/>
        </svg>

        <p class="stanza">In the <span class="pen-underline">landscape</span>, over the horizon,<br/>
        Nurture the soul, find the freedom.</p>

        <span class="poem__sig" style="color: #B88C88;">tai khan</span>
      </div>

      <!-- Pressed Cherry Blossom Petal Keepsake -->
      <div class="pressed-petal" aria-hidden="true">
        <svg viewBox="0 0 30 30" fill="#F4B8B8" stroke="#D8334A" stroke-width="0.6">
          <path d="M 15 2 C 22 8, 28 16, 22 24 C 18 28, 12 28, 8 24 C 2 16, 8 8, 15 2 Z"/>
        </svg>
      </div>
