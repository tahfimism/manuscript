<body data-family="A-cover">
<main class="cover">

  <!-- TEST OVERLAY: fullscreen cover.png with central click target. Remove this block to revert to the canvas+HTML cover. -->
  <div class="cover__image-test" aria-label="Manuscript cover image — click to enter">
    <img class="cover__image-test-img" src="images/cover.png" alt="" aria-hidden="true" />
    <a class="cover__image-test-hit" href="toc.html" aria-label="Enter the collection">
      <span class="cover__image-test-hit-label">enter</span>
    </a>
  </div>
  <style>
    .cover__image-test {
      position: absolute;
      inset: 0;
      z-index: 50;
      overflow: hidden;
    }
    .cover__image-test-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    .cover__image-test-hit {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 50%;
      display: block;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer;
      outline: none;
    }
    .cover__image-test-hit:focus-visible {
      outline: 2px dashed #F4ECD8;
      outline-offset: -8px;
    }
    .cover__image-test-hit-label {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
  </style>

  <!-- Handdrawn canvas illustration -->
  <canvas class="cover__art" id="coverCanvas" aria-hidden="true"></canvas>

  <!-- Handwritten title sits on top, real fonts for legibility -->
  <div class="cover__content">
    <h1 class="cover__title">Manuscript</h1>
    <p class="cover__sub">of a divine letter</p>
    <p class="cover__tagline">— a whisper exceeding the shadows —</p>
    <a class="cover__enter" href="toc.html">enter the collection</a>
    <div class="cover__author" style="margin-top: clamp(1.2rem, 2.5vh, 1.8rem);">TAHFIM &nbsp; KHAN</div>
  </div>
</main>
