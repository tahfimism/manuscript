<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="stSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#08071A"/>
      <stop offset="50%" stop-color="#15103A"/>
      <stop offset="100%" stop-color="#261A48"/>
    </linearGradient>
    <radialGradient id="stGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F4E8A8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F4E8A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="360" fill="url(#stSky)"/>
  <ellipse cx="400" cy="140" rx="400" ry="180" fill="url(#stGlow)"/>

  <!-- Stars (dense) -->
  <g fill="#F4E8A8">
    <circle cx="30"  cy="30" r="1.2"/><circle cx="70"  cy="70" r="0.7"/>
    <circle cx="110" cy="40" r="1"/><circle cx="150" cy="100" r="0.6"/>
    <circle cx="190" cy="50" r="1.2"/><circle cx="230" cy="110" r="0.7"/>
    <circle cx="270" cy="40" r="0.8"/><circle cx="310" cy="80" r="1"/>
    <circle cx="350" cy="30" r="0.6"/><circle cx="390" cy="100" r="1.4"/>
    <circle cx="430" cy="50" r="0.8"/><circle cx="470" cy="120" r="0.7"/>
    <circle cx="510" cy="40" r="1.1"/><circle cx="550" cy="80" r="0.7"/>
    <circle cx="590" cy="50" r="0.9"/><circle cx="630" cy="120" r="0.6"/>
    <circle cx="670" cy="40" r="1.3"/><circle cx="710" cy="80" r="0.7"/>
    <circle cx="750" cy="30" r="0.8"/>
    <circle cx="60"  cy="160" r="0.6"/><circle cx="180" cy="180" r="0.8"/>
    <circle cx="320" cy="160" r="0.6"/><circle cx="440" cy="180" r="0.7"/>
    <circle cx="580" cy="160" r="0.6"/><circle cx="720" cy="180" r="0.8"/>
  </g>

  <!-- 4-point sparkles (more) -->
  <g stroke="#F4E8A8" stroke-width="0.9" fill="none" stroke-linecap="round">
    <g transform="translate(100 90)"><line x1="0" y1="-12" x2="0" y2="12"/><line x1="-12" y1="0" x2="12" y2="0"/></g>
    <g transform="translate(280 100)" opacity="0.9"><line x1="0" y1="-10" x2="0" y2="10"/><line x1="-10" y1="0" x2="10" y2="0"/></g>
    <g transform="translate(500 110)" opacity="0.85"><line x1="0" y1="-14" x2="0" y2="14"/><line x1="-14" y1="0" x2="14" y2="0"/></g>
    <g transform="translate(680 90)" opacity="0.8"><line x1="0" y1="-11" x2="0" y2="11"/><line x1="-11" y1="0" x2="11" y2="0"/></g>
    <g transform="translate(180 220)" opacity="0.6"><line x1="0" y1="-8" x2="0" y2="8"/><line x1="-8" y1="0" x2="8" y2="0"/></g>
    <g transform="translate(620 200)" opacity="0.6"><line x1="0" y1="-9" x2="0" y2="9"/><line x1="-9" y1="0" x2="9" y2="0"/></g>
  </g>

  <!-- Trailing sparkles (comet tails) -->
  <g fill="#F4E8A8" opacity="0.7">
    <circle cx="104" cy="94" r="0.4"/>
    <circle cx="98"  cy="98" r="0.3"/>
    <circle cx="93"  cy="100" r="0.3"/>
    <circle cx="284" cy="105" r="0.5"/>
    <circle cx="278" cy="110" r="0.3"/>
    <circle cx="504" cy="116" r="0.5"/>
    <circle cx="498" cy="120" r="0.3"/>
    <circle cx="684" cy="96" r="0.4"/>
    <circle cx="678" cy="100" r="0.3"/>
  </g>

  <!-- Moonlit horizon (faint) -->
  <path d="M 0 270 Q 200 262 400 268 T 800 262" stroke="#A9C4D6" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M 0 290 Q 200 282 400 288 T 800 282" stroke="#A9C4D6" stroke-width="0.5" fill="none" opacity="0.3"/>

  <!-- Two braided threads (the souls entwine) -->
  <g stroke="#A9C4D6" stroke-width="1" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M 60 240 Q 140 210 220 230 T 380 260 Q 460 285 540 250 T 740 220"/>
    <path d="M 60 260 Q 140 230 220 250 T 380 280 Q 460 305 540 270 T 740 240"/>
  </g>
  <!-- Crossing heart / meeting point -->
  <circle cx="320" cy="262" r="3" fill="#F4E8A8" opacity="0.95"/>
  <circle cx="320" cy="262" r="7" fill="#F4E8A8" opacity="0.25"/>
  <circle cx="320" cy="262" r="14" fill="#F4E8A8" opacity="0.08"/>
  <!-- Small heart at crossing -->
  <path d="M 320 256 c -3 -3 -7 -1 -3 4 l 3 3 l 3 -3 c 4 -5 0 -7 -3 -4 Z" fill="#F4E8A8" opacity="0.85"/>
</svg>
