<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="chSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3A1820"/>
      <stop offset="40%" stop-color="#1F1010"/>
      <stop offset="100%" stop-color="#0A0808"/>
    </linearGradient>
    <radialGradient id="chFlameGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#F8B85C" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#C97A30" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C97A30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1010"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="chCandle" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFEFC8"/>
      <stop offset="50%" stop-color="#F8B85C"/>
      <stop offset="100%" stop-color="#C97A30"/>
    </radialGradient>
  </defs>

  <rect width="800" height="360" fill="url(#chSky)"/>

  <!-- Wide warm glow centered -->
  <circle cx="400" cy="160" r="240" fill="url(#chFlameGlow)"/>
  <circle cx="400" cy="160" r="120" fill="url(#chFlameGlow)" opacity="0.85"/>

  <!-- Single candle in center -->
  <g transform="translate(400 160)">
    <!-- wax body -->
    <rect x="-12" y="20" width="24" height="60" fill="#F4ECDC"/>
    <rect x="-12" y="20" width="24" height="6" fill="#E8DCC0"/>
    <rect x="-12" y="60" width="24" height="20" fill="#E8DCC0" opacity="0.85"/>
    <!-- melted wax drip -->
    <path d="M -12 26 Q -16 36 -10 44 L -12 26 Z" fill="#F4ECDC"/>
    <path d="M 12 30 Q 16 42 10 50 L 12 30 Z" fill="#F4ECDC"/>
    <!-- wick -->
    <line x1="0" y1="20" x2="0" y2="0" stroke="#3A2A1A" stroke-width="1.6"/>
    <!-- flame outer -->
    <path d="M 0 0 Q 12 -14 0 -28 Q -10 -42 0 -56 Q 8 -42 0 -28 Q 14 -14 0 0 Z" fill="url(#chCandle)"/>
    <!-- flame inner -->
    <path d="M 0 0 Q 6 -14 0 -28 Q -4 -42 0 -50 Q 4 -42 0 -28 Q 8 -14 0 0 Z" fill="#FFEFC8" opacity="0.85"/>
    <!-- flame core -->
    <ellipse cx="0" cy="-20" rx="2" ry="8" fill="#FFFFFF" opacity="0.9"/>
    <!-- candle holder -->
    <ellipse cx="0" cy="82" rx="32" ry="6" fill="#5C4A3A"/>
    <rect x="-26" y="78" width="52" height="6" fill="#5C4A3A"/>
  </g>

  <!-- Charred sea horizon -->
  <rect x="0" y="240" width="800" height="120" fill="url(#chSea)"/>
  <!-- horizon line glow -->
  <path d="M 0 244 Q 200 240 400 246 T 800 244" stroke="#C97A30" stroke-width="1.2" fill="none" opacity="0.75"/>
  <path d="M 0 248 Q 200 244 400 250 T 800 248" stroke="#F8B85C" stroke-width="0.6" fill="none" opacity="0.5"/>

  <!-- Cracks across char surface -->
  <g stroke="#C97A30" stroke-width="0.6" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 40 290 L 90 282 L 140 290 L 200 286"/>
    <path d="M 240 296 L 290 286 L 340 296 L 400 290"/>
    <path d="M 440 296 L 500 286 L 560 294 L 620 290"/>
    <path d="M 660 292 L 720 286 L 760 294"/>
    <path d="M 80 320 L 140 314 L 200 322"/>
    <path d="M 280 326 L 340 318 L 420 328"/>
    <path d="M 460 324 L 540 316 L 620 326"/>
    <path d="M 660 320 L 740 314"/>
    <path d="M 100 350 L 200 344 L 280 350"/>
    <path d="M 360 354 L 460 348 L 540 354"/>
    <path d="M 580 350 L 680 344 L 760 350"/>
  </g>

  <!-- Distant smoke wisps -->
  <g fill="#1F1010" opacity="0.5">
    <ellipse cx="320" cy="60" rx="22" ry="6"/>
    <ellipse cx="340" cy="40" rx="18" ry="5"/>
    <ellipse cx="460" cy="70" rx="20" ry="6"/>
    <ellipse cx="480" cy="50" rx="16" ry="5"/>
  </g>

  <!-- Floating embers -->
  <g fill="#F8B85C" opacity="0.85">
    <circle cx="120" cy="60"  r="0.9"/>
    <circle cx="200" cy="40"  r="1.2"/>
    <circle cx="280" cy="100" r="0.8"/>
    <circle cx="540" cy="60"  r="0.9"/>
    <circle cx="620" cy="100" r="1.1"/>
    <circle cx="700" cy="50"  r="0.8"/>
    <circle cx="80"  cy="160" r="0.7"/>
    <circle cx="160" cy="180" r="0.6"/>
    <circle cx="640" cy="180" r="0.7"/>
    <circle cx="720" cy="160" r="0.6"/>
  </g>
  <!-- larger glowing motes with halo -->
  <g>
    <circle cx="180" cy="120" r="2" fill="#FFE680" opacity="0.95"/>
    <circle cx="180" cy="120" r="5" fill="#F8B85C" opacity="0.25"/>
    <circle cx="600" cy="140" r="2" fill="#FFE680" opacity="0.95"/>
    <circle cx="600" cy="140" r="5" fill="#F8B85C" opacity="0.25"/>
  </g>
</svg>
