<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="hmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#A0B8BC"/>
      <stop offset="40%" stop-color="#C8D4D8"/>
      <stop offset="80%" stop-color="#DCE2E0"/>
      <stop offset="100%" stop-color="#E4E8E6"/>
    </linearGradient>
    <linearGradient id="hmRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A2A1A"/>
      <stop offset="100%" stop-color="#3A1408"/>
    </linearGradient>
    <linearGradient id="hmWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E0C0"/>
      <stop offset="100%" stop-color="#D0B898"/>
    </linearGradient>
    <linearGradient id="hmWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5C898"/>
      <stop offset="100%" stop-color="#E0A868"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#hmSky)"/>

  <!-- Distant hills (layered) -->
  <path d="M 0 200 Q 200 170 400 185 T 800 175 L 800 230 L 0 230 Z" fill="#A8B8B8" opacity="0.55"/>
  <path d="M 0 220 Q 200 195 400 210 T 800 200 L 800 250 L 0 250 Z" fill="#8C9E9C" opacity="0.6"/>

  <!-- Far pine trees silhouettes -->
  <g fill="#5C6E68" opacity="0.65">
    <polygon points="100,210 110,180 120,210"/>
    <polygon points="140,212 152,178 164,212"/>
    <polygon points="280,212 290,182 300,212"/>
    <polygon points="500,210 512,178 524,210"/>
    <polygon points="620,210 632,180 644,210"/>
    <polygon points="680,212 692,184 704,212"/>
  </g>

  <!-- Detailed cottage -->
  <g transform="translate(70 200)">
    <!-- shadow -->
    <ellipse cx="32" cy="70" rx="50" ry="3.5" fill="#1A2030" opacity="0.18"/>
    <!-- side wing -->
    <rect x="-6" y="24" width="14" height="46" fill="#A89878"/>
    <polygon points="-9,24 1,12 11,24" fill="#3A1408"/>
    <rect x="-2" y="36" width="5" height="6" fill="url(#hmWin)"/>
    <rect x="-2" y="36" width="5" height="6" fill="none" stroke="#1A0808" stroke-width="0.4"/>
    <!-- main body -->
    <rect x="6" y="10" width="56" height="60" fill="url(#hmWall)"/>
    <!-- siding -->
    <g stroke="#9A8060" stroke-width="0.35" opacity="0.55">
      <line x1="6" y1="18" x2="62" y2="18"/>
      <line x1="6" y1="26" x2="62" y2="26"/>
      <line x1="6" y1="34" x2="62" y2="34"/>
      <line x1="6" y1="42" x2="62" y2="42"/>
      <line x1="6" y1="50" x2="62" y2="50"/>
      <line x1="6" y1="58" x2="62" y2="58"/>
    </g>
    <!-- roof -->
    <polygon points="2,10 34,-22 66,10" fill="url(#hmRoof)"/>
    <polygon points="34,-22 66,10 66,6 36,-26" fill="#2A1408" opacity="0.7"/>
    <g stroke="#1A0808" stroke-width="0.3" opacity="0.55">
      <line x1="2" y1="10"  x2="66" y2="10"/>
      <line x1="6" y1="4"  x2="62" y2="4"/>
      <line x1="10" y1="-2" x2="58" y2="-2"/>
      <line x1="14" y1="-8" x2="54" y2="-8"/>
      <line x1="18" y1="-14" x2="50" y2="-14"/>
    </g>
    <!-- eaves shadow -->
    <rect x="2" y="10" width="64" height="2" fill="#3A1408" opacity="0.6"/>
    <!-- chimney -->
    <rect x="50" y="-26" width="5" height="14" fill="#5A4A3A"/>
    <rect x="49" y="-27" width="7" height="2" fill="#3A2A1A"/>
    <!-- smoke -->
    <g fill="#FFFFFF" opacity="0.7">
      <ellipse cx="52.5" cy="-32" rx="2" ry="3"/>
      <ellipse cx="55" cy="-40" rx="3" ry="3.5" opacity="0.55"/>
      <ellipse cx="50" cy="-48" rx="3.5" ry="4" opacity="0.4"/>
    </g>
    <!-- window left (2-pane) -->
    <rect x="12" y="22" width="14" height="14" fill="url(#hmWin)"/>
    <rect x="12" y="22" width="14" height="14" fill="none" stroke="#3A2A1A" stroke-width="0.7"/>
    <line x1="19" y1="22" x2="19" y2="36" stroke="#3A2A1A" stroke-width="0.5"/>
    <line x1="12" y1="29" x2="26" y2="29" stroke="#3A2A1A" stroke-width="0.5"/>
    <rect x="11" y="36" width="16" height="1.5" fill="#3A2A1A"/>
    <!-- window right (taller) -->
    <rect x="42" y="22" width="14" height="20" fill="url(#hmWin)"/>
    <rect x="42" y="22" width="14" height="20" fill="none" stroke="#3A2A1A" stroke-width="0.7"/>
    <line x1="49" y1="22" x2="49" y2="42" stroke="#3A2A1A" stroke-width="0.5"/>
    <line x1="42" y1="29" x2="56" y2="29" stroke="#3A2A1A" stroke-width="0.5"/>
    <line x1="42" y1="36" x2="56" y2="36" stroke="#3A2A1A" stroke-width="0.5"/>
    <rect x="41" y="42" width="16" height="1.5" fill="#3A2A1A"/>
    <!-- door -->
    <rect x="28" y="44" width="8" height="26" fill="#5A3A2A"/>
    <rect x="28" y="44" width="8" height="26" fill="none" stroke="#2A1408" stroke-width="0.5"/>
    <circle cx="34" cy="58" r="0.6" fill="#F5B868"/>
    <!-- porch step -->
    <rect x="26" y="68" width="14" height="2" fill="#3A2A1A"/>
    <!-- snow on roof -->
    <path d="M 4 10 Q 34 -20 64 10 L 64 8 Q 34 -24 4 8 Z" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Snow ground -->
  <path d="M 0 270 Q 200 258 400 270 T 800 260 L 800 360 L 0 360 Z" fill="#F4F4F2"/>

  <!-- Footprints winding through snow -->
  <g fill="#C8C0B0" opacity="0.85">
    <ellipse cx="200" cy="320" rx="5" ry="7.5"/>
    <ellipse cx="240" cy="312" rx="5" ry="7" opacity="0.85"/>
    <ellipse cx="280" cy="302" rx="4.5" ry="6.5" opacity="0.78"/>
    <ellipse cx="320" cy="292" rx="4" ry="6" opacity="0.65"/>
    <ellipse cx="360" cy="280" rx="3.5" ry="5.5" opacity="0.55"/>
    <ellipse cx="400" cy="270" rx="3" ry="5" opacity="0.45"/>
    <ellipse cx="440" cy="260" rx="3" ry="4.5" opacity="0.35"/>
    <ellipse cx="480" cy="252" rx="2.5" ry="4" opacity="0.25"/>
    <ellipse cx="520" cy="246" rx="2" ry="3.5" opacity="0.18"/>
  </g>
  <!-- second pair offset -->
  <g fill="#C8C0B0" opacity="0.85">
    <ellipse cx="210" cy="335" rx="4" ry="6"/>
    <ellipse cx="250" cy="325" rx="4" ry="5.5" opacity="0.8"/>
    <ellipse cx="290" cy="315" rx="3.5" ry="5" opacity="0.65"/>
    <ellipse cx="330" cy="304" rx="3" ry="4.5" opacity="0.5"/>
    <ellipse cx="370" cy="292" rx="2.8" ry="4" opacity="0.4"/>
    <ellipse cx="410" cy="282" rx="2.5" ry="3.5" opacity="0.3"/>
  </g>

  <!-- Rain streaks down right side (many strands) -->
  <g stroke="#5C6E72" stroke-width="0.6" stroke-linecap="round" opacity="0.45">
    <line x1="600" y1="20" x2="595" y2="55"/>
    <line x1="620" y1="40" x2="615" y2="80"/>
    <line x1="640" y1="20" x2="635" y2="60"/>
    <line x1="660" y1="50" x2="655" y2="90"/>
    <line x1="680" y1="30" x2="675" y2="70"/>
    <line x1="700" y1="60" x2="695" y2="100"/>
    <line x1="720" y1="20" x2="715" y2="60"/>
    <line x1="740" y1="40" x2="735" y2="80"/>
    <line x1="760" y1="30" x2="755" y2="70"/>
    <line x1="780" y1="50" x2="775" y2="90"/>
    <line x1="610" y1="100" x2="605" y2="140"/>
    <line x1="640" y1="120" x2="635" y2="160"/>
    <line x1="670" y1="110" x2="665" y2="150"/>
    <line x1="700" y1="130" x2="695" y2="170"/>
    <line x1="730" y1="120" x2="725" y2="160"/>
    <line x1="760" y1="130" x2="755" y2="170"/>
    <line x1="620" y1="180" x2="615" y2="220"/>
    <line x1="660" y1="200" x2="655" y2="240"/>
    <line x1="700" y1="200" x2="695" y2="240"/>
  </g>

  <!-- Bare pines cluster (tall conifer silhouettes) -->
  <g transform="translate(540 230)">
    <!-- shadow -->
    <ellipse cx="0" cy="40" rx="8" ry="1.5" fill="#1A2030" opacity="0.25"/>
    <!-- conifer: point up, base wide -->
    <polygon points="0,-30 12,40 -12,40" fill="#3A4A3A"/>
    <!-- inner shading -->
    <polygon points="0,-30 4,40 -12,40" fill="#2A3A2A"/>
    <!-- trunk -->
    <rect x="-2" y="40" width="4" height="6" fill="#2A1A1A"/>
  </g>
  <g transform="translate(580 240) scale(0.7)">
    <ellipse cx="0" cy="40" rx="8" ry="1.5" fill="#1A2030" opacity="0.25"/>
    <polygon points="0,-30 12,40 -12,40" fill="#3A4A3A"/>
    <polygon points="0,-30 4,40 -12,40" fill="#2A3A2A"/>
    <rect x="-2" y="40" width="4" height="6" fill="#2A1A1A"/>
  </g>
  <g transform="translate(620 245) scale(0.55)">
    <ellipse cx="0" cy="40" rx="8" ry="1.5" fill="#1A2030" opacity="0.25"/>
    <polygon points="0,-30 12,40 -12,40" fill="#3A4A3A"/>
    <rect x="-2" y="40" width="4" height="6" fill="#2A1A1A"/>
  </g>
</svg>
