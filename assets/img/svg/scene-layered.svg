<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="lyrBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#CFC8CC"/>
      <stop offset="100%" stop-color="#B0A8AC"/>
    </linearGradient>
    <linearGradient id="lyr1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A8E94"/>
      <stop offset="100%" stop-color="#7A6E74"/>
    </linearGradient>
    <linearGradient id="lyr2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8AEB4"/>
      <stop offset="100%" stop-color="#9A8E94"/>
    </linearGradient>
    <linearGradient id="lyr3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8D0D4"/>
      <stop offset="100%" stop-color="#B8AEB4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#lyrBg)"/>

  <!-- Layer 1 (back, darkest, biggest offset) -->
  <g transform="translate(180 80)">
    <rect width="440" height="240" fill="url(#lyr1)"/>
    <!-- fiber/paper texture lines -->
    <g stroke="#5A4E54" stroke-width="0.3" opacity="0.5">
      <line x1="0" y1="40" x2="440" y2="38"/>
      <line x1="0" y1="80" x2="440" y2="78"/>
      <line x1="0" y1="120" x2="440" y2="118"/>
      <line x1="0" y1="160" x2="440" y2="158"/>
      <line x1="0" y1="200" x2="440" y2="198"/>
    </g>
    <!-- corner curl -->
    <path d="M 0 0 L 30 0 L 0 30 Z" fill="#7A6E74"/>
    <!-- shadow beneath -->
    <rect x="0" y="240" width="440" height="6" fill="#5A4E54" opacity="0.4"/>
  </g>

  <!-- Layer 2 (mid) -->
  <g transform="translate(220 100)">
    <rect width="440" height="240" fill="url(#lyr2)"/>
    <g stroke="#7A6E74" stroke-width="0.3" opacity="0.5">
      <line x1="0" y1="40" x2="440" y2="38"/>
      <line x1="0" y1="80" x2="440" y2="78"/>
      <line x1="0" y1="120" x2="440" y2="118"/>
      <line x1="0" y1="160" x2="440" y2="158"/>
      <line x1="0" y1="200" x2="440" y2="198"/>
    </g>
    <!-- torn edge top -->
    <path d="M 0 0 L 30 4 L 60 -2 L 90 4 L 120 0 L 150 5 L 180 -1 L 210 4 L 240 0 L 270 5 L 300 -1 L 330 4 L 360 0 L 390 5 L 420 -1 L 440 2 L 440 0 Z" fill="#7A6E74" opacity="0.85"/>
    <rect x="0" y="240" width="440" height="6" fill="#7A6E74" opacity="0.4"/>
  </g>

  <!-- Layer 3 (front, lightest, smallest offset) -->
  <g transform="translate(260 120)">
    <rect width="440" height="240" fill="url(#lyr3)"/>
    <g stroke="#9A8E94" stroke-width="0.3" opacity="0.5">
      <line x1="0" y1="40" x2="440" y2="38"/>
      <line x1="0" y1="80" x2="440" y2="78"/>
      <line x1="0" y1="120" x2="440" y2="118"/>
      <line x1="0" y1="160" x2="440" y2="158"/>
      <line x1="0" y1="200" x2="440" y2="198"/>
    </g>
    <!-- ruled lines (faint) -->
    <g stroke="#5A4E54" stroke-width="0.2" opacity="0.3">
      <line x1="0" y1="20" x2="440" y2="20"/>
      <line x1="0" y1="60" x2="440" y2="60"/>
      <line x1="0" y1="100" x2="440" y2="100"/>
      <line x1="0" y1="140" x2="440" y2="140"/>
      <line x1="0" y1="180" x2="440" y2="180"/>
      <line x1="0" y1="220" x2="440" y2="220"/>
    </g>
    <!-- A faint pencil mark -->
    <g font-family="'Caveat', cursive" font-size="14" fill="#5A4E54" opacity="0.5">
      <text x="40" y="50">silence,</text>
    </g>
    <!-- shadow on top -->
    <rect x="0" y="240" width="440" height="6" fill="#9A8E94" opacity="0.4"/>
  </g>

  <!-- Stitching between layer 1 and 2 -->
  <g stroke="#5A4E54" stroke-width="0.5" fill="none" opacity="0.5" stroke-dasharray="3 3">
    <line x1="180" y1="320" x2="660" y2="280"/>
  </g>
  <g stroke="#5A4E54" stroke-width="0.5" fill="none" opacity="0.5" stroke-dasharray="3 3">
    <line x1="220" y1="340" x2="700" y2="300"/>
  </g>
</svg>