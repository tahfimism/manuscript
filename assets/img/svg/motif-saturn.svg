<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" aria-hidden="true">
  <g fill="none" stroke="#E8A0A8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Planet body with cross-hatch lines -->
    <ellipse cx="180" cy="120" rx="55" ry="20" transform="rotate(20 180 120)"/>
    <ellipse cx="180" cy="118" rx="56" ry="22" stroke-dasharray="3 4" opacity="0.7"/>
    <ellipse cx="180" cy="125" rx="55" ry="20" transform="rotate(20 180 120)"/>
    <!-- ring -->
    <ellipse cx="180" cy="135" rx="105" ry="12" stroke-width="1.2" transform="rotate(-15 180 135)"/>
    <!-- second ring -->
    <ellipse cx="180" cy="138" rx="100" ry="9" stroke-width="0.8" transform="rotate(-15 180 138)" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Stars / sparkles around -->
    <g fill="#E8A0A8" stroke="none">
      <circle cx="40"  cy="60"  r="1.5"/>
      <circle cx="60"  cy="180" r="1"/>
      <circle cx="100" cy="220" r="1.2"/>
      <circle cx="240" cy="60"  r="1"/>
      <circle cx="270" cy="200" r="1.5"/>
      <circle cx="120" cy="40"  r="0.8"/>
    </g>
    <!-- 4-pointed sparkles -->
    <g stroke-width="1" fill="none">
      <path d="M 30 130 L 30 150 M 20 140 L 40 140"/>
      <path d="M 250 240 L 250 252 M 244 246 L 256 246"/>
      <path d="M 80 90 L 80 100 M 75 95 L 85 95"/>
      <path d="M 230 90 L 230 102 M 224 96 L 236 96"/>
    </g>
  </g>
</svg>
