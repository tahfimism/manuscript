<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7A0E18"/>
      <stop offset="35%" stop-color="#A01628"/>
      <stop offset="65%" stop-color="#C42E3A"/>
      <stop offset="100%" stop-color="#5A0A12"/>
    </linearGradient>
    <radialGradient id="dGlow" cx="55%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F8DCC0" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#D04848" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5A0A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dPlanet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F8D8B0"/>
      <stop offset="55%" stop-color="#E8A488"/>
      <stop offset="100%" stop-color="#A05838"/>
    </radialGradient>
  </defs>

  <rect width="800" height="360" fill="url(#dBg)"/>
  <ellipse cx="440" cy="140" rx="380" ry="180" fill="url(#dGlow)"/>

  <!-- Sparkle stardust -->
  <g fill="#F8DCC0" opacity="0.85">
    <circle cx="80"  cy="40"  r="0.9"/>
    <circle cx="140" cy="90"  r="0.6"/>
    <circle cx="220" cy="60"  r="1.1"/>
    <circle cx="320" cy="100" r="0.7"/>
    <circle cx="420" cy="50"  r="0.5"/>
    <circle cx="520" cy="80"  r="0.9"/>
    <circle cx="620" cy="40"  r="1.2"/>
    <circle cx="700" cy="100" r="0.6"/>
    <circle cx="760" cy="60"  r="0.8"/>
    <circle cx="60"  cy="170" r="0.6"/>
    <circle cx="180" cy="200" r="0.8"/>
    <circle cx="280" cy="180" r="0.5"/>
    <circle cx="660" cy="200" r="0.9"/>
  </g>

  <!-- 4-point sparkles -->
  <g stroke="#F8DCC0" stroke-width="0.9" fill="none" stroke-linecap="round">
    <g transform="translate(120 140)"><line x1="0" y1="-10" x2="0" y2="10"/><line x1="-10" y1="0" x2="10" y2="0"/></g>
    <g transform="translate(580 130)" opacity="0.85"><line x1="0" y1="-12" x2="0" y2="12"/><line x1="-12" y1="0" x2="12" y2="0"/></g>
    <g transform="translate(720 180)" opacity="0.7"><line x1="0" y1="-8" x2="0" y2="8"/><line x1="-8" y1="0" x2="8" y2="0"/></g>
  </g>

  <!-- Saturn -->
  <g transform="translate(280 160)">
    <!-- back of ring -->
    <ellipse cx="120" cy="80" rx="160" ry="14" fill="none" stroke="#F8DCC0" stroke-width="1.1" opacity="0.55" transform="rotate(-18 120 80)"/>
    <ellipse cx="120" cy="80" rx="156" ry="11" fill="none" stroke="#F8DCC0" stroke-width="0.6" opacity="0.4" stroke-dasharray="5 4" transform="rotate(-18 120 80)"/>
    <!-- planet -->
    <circle cx="120" cy="60" r="44" fill="url(#dPlanet)"/>
    <ellipse cx="120" cy="60" rx="44" ry="10" fill="none" stroke="#7A2818" stroke-width="0.5" opacity="0.5"/>
    <ellipse cx="120" cy="48" rx="42" ry="6" fill="none" stroke="#F8DCC0" stroke-width="0.4" opacity="0.4"/>
    <!-- front of ring -->
    <path d="M -40 80 A 160 14 0 0 0 280 80" fill="none" stroke="#F8DCC0" stroke-width="1.3" transform="rotate(-18 120 80)"/>
    <path d="M -30 84 A 154 8 0 0 0 274 84" fill="none" stroke="#F8DCC0" stroke-width="0.6" opacity="0.65" transform="rotate(-18 120 80)"/>
  </g>

  <!-- Lettered star arc bottom -->
  <g fill="none" stroke="#F8DCC0" stroke-width="0.6" stroke-linecap="round" opacity="0.55">
    <path d="M 60 320 Q 200 290 400 300 T 740 280"/>
  </g>
  <g fill="#F8DCC0">
    <circle cx="80"  cy="318" r="1.2"/>
    <circle cx="200" cy="298" r="0.9"/>
    <circle cx="340" cy="296" r="1.4"/>
    <circle cx="480" cy="300" r="0.9"/>
    <circle cx="620" cy="288" r="1.1"/>
    <circle cx="740" cy="280" r="1.4"/>
  </g>

  <!-- Horizon glow strip -->
  <ellipse cx="400" cy="360" rx="500" ry="50" fill="#F8DCC0" opacity="0.06"/>
</svg>
