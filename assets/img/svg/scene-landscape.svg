<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="lsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F8E0BC"/>
      <stop offset="35%" stop-color="#F0C8A0"/>
      <stop offset="60%" stop-color="#E0A878"/>
      <stop offset="100%" stop-color="#A87858"/>
    </linearGradient>
    <radialGradient id="lsSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFAEC"/>
      <stop offset="100%" stop-color="#F8D08C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="360" fill="url(#lsSky)"/>

  <!-- Sun (large, low) -->
  <circle cx="400" cy="160" r="120" fill="url(#lsSun)"/>
  <circle cx="400" cy="160" r="40" fill="#FFFAEC" opacity="0.9"/>
  <circle cx="400" cy="160" r="28" fill="#FFFFFF" opacity="0.85"/>

  <!-- Distant clouds -->
  <ellipse cx="120" cy="80"  rx="100" ry="10" fill="#FFFFFF" opacity="0.55"/>
  <ellipse cx="640" cy="100" rx="120" ry="12" fill="#FFFFFF" opacity="0.45"/>
  <ellipse cx="280" cy="60"  rx="80"  ry="8"  fill="#FFFFFF" opacity="0.4"/>
  <ellipse cx="560" cy="50"  rx="70"  ry="7"  fill="#FFFFFF" opacity="0.35"/>

  <!-- Sun rays -->
  <g stroke="#F8D08C" stroke-width="1.4" stroke-linecap="round" opacity="0.5">
    <line x1="400" y1="80"  x2="400" y2="65"/>
    <line x1="320" y1="160" x2="305" y2="158"/>
    <line x1="480" y1="160" x2="495" y2="158"/>
    <line x1="350" y1="120" x2="338" y2="108"/>
    <line x1="450" y1="120" x2="462" y2="108"/>
    <line x1="340" y1="200" x2="328" y2="210"/>
    <line x1="460" y1="200" x2="472" y2="210"/>
  </g>

  <!-- Layered mountains (4 layers for atmospheric depth) -->
  <path d="M 0 200 L 60 165 L 120 185 L 180 155 L 240 180 L 300 160 L 360 185 L 420 165 L 480 180 L 540 160 L 600 185 L 660 165 L 720 180 L 800 175 L 800 230 L 0 230 Z" fill="#8C6A48" opacity="0.55"/>
  <path d="M 0 225 L 80 190 L 160 215 L 240 195 L 320 215 L 400 195 L 480 215 L 560 195 L 640 220 L 720 200 L 800 220 L 800 260 L 0 260 Z" fill="#6A4830" opacity="0.65"/>
  <path d="M 0 250 L 100 220 L 200 245 L 300 225 L 400 250 L 500 225 L 600 250 L 700 230 L 800 248 L 800 290 L 0 290 Z" fill="#4A3020" opacity="0.75"/>

  <!-- Mid pines -->
  <g fill="#3A2818" opacity="0.85">
    <polygon points="120,250 132,210 144,250"/>
    <polygon points="160,250 175,200 190,250"/>
    <polygon points="240,250 252,210 264,250"/>
    <polygon points="560,250 575,205 590,250"/>
    <polygon points="640,250 655,210 670,250"/>
  </g>

  <!-- Foreground horizon brush -->
  <path d="M 0 285 Q 200 278 400 285 T 800 282" stroke="#3A2A1A" stroke-width="1.4" fill="none" opacity="0.5"/>

  <!-- Wing silhouette (large, central) -->
  <g transform="translate(140 100)" fill="#3A2A1A" opacity="0.7">
    <path d="M 0 0 Q 30 -16 60 -8 Q 80 0 60 10 Q 30 12 0 0 Z"/>
    <path d="M -4 -4 Q -16 -16 -28 -6 Q -18 4 -4 -4 Z"/>
    <path d="M -28 -6 Q -36 -14 -34 -2" stroke="#3A2A1A" stroke-width="0.8" fill="none"/>
    <path d="M 60 -8 Q 78 -16 78 -2" stroke="#3A2A1A" stroke-width="0.8" fill="none"/>
    <path d="M 12 -10 Q 18 -22 28 -18" stroke="#3A2A1A" stroke-width="0.8" fill="none"/>
  </g>
  <!-- Smaller wings for company -->
  <g transform="translate(420 80)" fill="#3A2A1A" opacity="0.55">
    <path d="M 0 0 Q 16 -10 32 -4 Q 40 0 32 6 Q 16 8 0 0 Z"/>
  </g>
  <g transform="translate(560 130)" fill="#3A2A1A" opacity="0.5">
    <path d="M 0 0 Q 12 -8 24 -2 Q 30 0 24 4 Q 12 6 0 0 Z"/>
  </g>

  <!-- Birds (V shapes) -->
  <g stroke="#3A2A1A" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M 280 100 Q 286 95 292 100 Q 298 95 304 100"/>
    <path d="M 320 130 Q 326 125 332 130 Q 338 125 344 130"/>
    <path d="M 360 90 Q 365 86 370 90 Q 375 86 380 90"/>
    <path d="M 660 180 Q 666 175 672 180 Q 678 175 684 180"/>
    <path d="M 700 160 Q 705 156 710 160 Q 715 156 720 160"/>
  </g>
</svg>
