<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="nbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E8D8C0"/>
      <stop offset="100%" stop-color="#D0BFA0"/>
    </linearGradient>
    <linearGradient id="nbPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8EED8"/>
      <stop offset="100%" stop-color="#E8D8C0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#nbBg)"/>

  <!-- Notebook paper -->
  <g transform="translate(140 30)">
    <!-- paper sheet -->
    <rect x="0" y="0" width="520" height="300" fill="url(#nbPaper)"/>
    <!-- ruled lines -->
    <g stroke="#5A4A3A" stroke-width="0.4" opacity="0.4">
      <line x1="0" y1="30"  x2="520" y2="30"/>
      <line x1="0" y1="50"  x2="520" y2="50"/>
      <line x1="0" y1="70"  x2="520" y2="70"/>
      <line x1="0" y1="90"  x2="520" y2="90"/>
      <line x1="0" y1="110" x2="520" y2="110"/>
      <line x1="0" y1="130" x2="520" y2="130"/>
      <line x1="0" y1="150" x2="520" y2="150"/>
      <line x1="0" y1="170" x2="520" y2="170"/>
      <line x1="0" y1="190" x2="520" y2="190"/>
      <line x1="0" y1="210" x2="520" y2="210"/>
      <line x1="0" y1="230" x2="520" y2="230"/>
      <line x1="0" y1="250" x2="520" y2="250"/>
      <line x1="0" y1="270" x2="520" y2="270"/>
    </g>
    <!-- Red margin -->
    <line x1="60" y1="0" x2="60" y2="300" stroke="#8B2E2E" stroke-width="1" opacity="0.65"/>
    <!-- Blue baseline for handwriting baseline -->
    <g stroke="#5A7AB8" stroke-width="0.3" opacity="0.4">
      <line x1="0" y1="32"  x2="520" y2="32"/>
      <line x1="0" y1="52"  x2="520" y2="52"/>
      <line x1="0" y1="72"  x2="520" y2="72"/>
      <line x1="0" y1="92"  x2="520" y2="92"/>
      <line x1="0" y1="112" x2="520" y2="112"/>
      <line x1="0" y1="132" x2="520" y2="132"/>
      <line x1="0" y1="152" x2="520" y2="152"/>
      <line x1="0" y1="172" x2="520" y2="172"/>
      <line x1="0" y1="192" x2="520" y2="192"/>
      <line x1="0" y1="212" x2="520" y2="212"/>
      <line x1="0" y1="232" x2="520" y2="232"/>
      <line x1="0" y1="252" x2="520" y2="252"/>
      <line x1="0" y1="272" x2="520" y2="272"/>
    </g>
    <!-- Three punched holes -->
    <circle cx="20" cy="60"  r="6" fill="#E8D8C0"/>
    <circle cx="20" cy="60"  r="6" fill="none" stroke="#5A4A3A" stroke-width="0.4" opacity="0.4"/>
    <circle cx="20" cy="150" r="6" fill="#E8D8C0"/>
    <circle cx="20" cy="150" r="6" fill="none" stroke="#5A4A3A" stroke-width="0.4" opacity="0.4"/>
    <circle cx="20" cy="240" r="6" fill="#E8D8C0"/>
    <circle cx="20" cy="240" r="6" fill="none" stroke="#5A4A3A" stroke-width="0.4" opacity="0.4"/>
    <!-- Folded corner -->
    <path d="M 500 0 L 520 0 L 520 20 Z" fill="#D0BFA0"/>
    <path d="M 500 0 L 520 20" stroke="#5A4A3A" stroke-width="0.3" opacity="0.4" fill="none"/>
  </g>

  <!-- Ink blot (small) -->
  <g transform="translate(280 120)" fill="#1A2A4A" opacity="0.7">
    <ellipse cx="0" cy="0" rx="4" ry="3"/>
    <circle cx="-3" cy="-2" r="1.4"/>
    <circle cx="2" cy="2" r="1.1"/>
  </g>

  <!-- Pencil scribble (eraser scribble) -->
  <g transform="translate(380 200)" stroke="#5A4A3A" stroke-width="0.6" fill="none" opacity="0.45">
    <path d="M 0 0 Q 6 -4 12 0 T 24 0 T 36 0 T 48 -2"/>
    <path d="M 0 4 Q 6 0 12 4 T 24 4"/>
  </g>

  <!-- Crossed-out lines -->
  <g transform="translate(180 70)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#1A2A4A" stroke-width="0.8" opacity="0.65"/>
    <line x1="-4" y1="-4" x2="100" y2="4" stroke="#8B2E2E" stroke-width="1" opacity="0.65"/>
  </g>
  <g transform="translate(180 130)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#1A2A4A" stroke-width="0.8" opacity="0.65"/>
    <line x1="-4" y1="-4" x2="120" y2="4" stroke="#8B2E2E" stroke-width="1" opacity="0.65"/>
  </g>
</svg>