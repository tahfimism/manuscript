<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="wgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#A0BCC8"/>
      <stop offset="50%" stop-color="#C8DCE4"/>
      <stop offset="100%" stop-color="#D8E2E8"/>
    </linearGradient>
    <linearGradient id="wgShore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5D2EA"/>
      <stop offset="100%" stop-color="#C8A8C8"/>
    </linearGradient>
    <linearGradient id="wgWine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A1A28"/>
      <stop offset="100%" stop-color="#3A0810"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" fill="url(#wgSky)"/>

  <!-- Distant clouds -->
  <ellipse cx="160" cy="50" rx="100" ry="8" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="600" cy="70" rx="120" ry="10" fill="#FFFFFF" opacity="0.45"/>

  <!-- Sea band -->
  <rect x="0" y="180" width="800" height="80" fill="#5C7C84" opacity="0.65"/>
  <path d="M 0 185 Q 200 182 400 188 T 800 184" stroke="#FFFFFF" stroke-width="0.5" fill="none" opacity="0.5"/>

  <!-- Shore / sand -->
  <rect x="0" y="220" width="800" height="40" fill="url(#wgShore)"/>

  <!-- Wine glass left, with wine in it -->
  <g transform="translate(160 90)">
    <!-- shadow -->
    <ellipse cx="0" cy="138" rx="20" ry="3" fill="#000000" opacity="0.3"/>
    <!-- stem -->
    <line x1="0" y1="40" x2="0" y2="128" stroke="#F4ECD8" stroke-width="2"/>
    <!-- base -->
    <ellipse cx="0" cy="132" rx="22" ry="4" fill="#F4ECD8" opacity="0.95"/>
    <ellipse cx="0" cy="132" rx="22" ry="4" fill="none" stroke="#3A2A1A" stroke-width="0.6"/>
    <!-- bowl -->
    <path d="M -36 -22 Q -36 30 0 40 Q 36 30 36 -22 Z" fill="none" stroke="#F4ECD8" stroke-width="2"/>
    <path d="M -36 -22 Q -36 30 0 40 Q 36 30 36 -22 Z" fill="#F4ECD8" fill-opacity="0.08"/>
    <!-- wine inside -->
    <path d="M -32 6 Q -32 30 0 36 Q 32 30 32 6 Z" fill="url(#wgWine)" opacity="0.85"/>
    <!-- wine meniscus -->
    <ellipse cx="0" cy="6" rx="32" ry="3" fill="#3A0810"/>
    <!-- rim highlight -->
    <ellipse cx="0" cy="-22" rx="36" ry="3" fill="none" stroke="#F4ECD8" stroke-width="1.4"/>
    <!-- wine reflection in glass (the heart-shaped glow) -->
    <path d="M 0 18 c -4 -4 -8 0 -3 6 l 3 4 l 3 -4 c 5 -6 1 -10 -3 -6 Z" fill="#F4B8B8" opacity="0.55"/>
  </g>

  <!-- Lone figure on shore right -->
  <g transform="translate(640 218)">
    <!-- shadow on sand -->
    <ellipse cx="0" cy="6" rx="22" ry="2.5" fill="#5A4860" opacity="0.6"/>
    <!-- coat -->
    <path d="M -14 0 L 14 0 L 18 32 L -18 32 Z" fill="#3A3640"/>
    <!-- coat folds -->
    <path d="M -6 4 L -4 30 M 6 4 L 4 30" stroke="#1A1820" stroke-width="0.5" opacity="0.7"/>
    <!-- shoulders -->
    <path d="M -10 0 L 10 0 L 8 4 L -8 4 Z" fill="#5A4858"/>
    <!-- head -->
    <circle cx="0" cy="-10" r="6" fill="#3A3640"/>
    <!-- hood line -->
    <path d="M -7 -10 Q 0 -14 7 -10" stroke="#1A1820" stroke-width="1" fill="none"/>
    <!-- scarf fluttering -->
    <path d="M -10 6 Q -16 10 -22 6 L -16 12 Z" fill="#5A4858" opacity="0.85"/>
  </g>

  <!-- Stars inside wine glass (the ghost of warmth) -->
  <g fill="#F4E8A8" opacity="0.95">
    <circle cx="148" cy="100" r="0.8"/>
    <circle cx="170" cy="108" r="0.6"/>
    <circle cx="158" cy="118" r="0.5"/>
    <circle cx="146" cy="115" r="0.4"/>
  </g>

  <!-- Distant birds -->
  <g stroke="#3A3640" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M 320 80 Q 326 75 332 80 Q 338 75 344 80"/>
    <path d="M 380 110 Q 386 105 392 110 Q 398 105 404 110"/>
    <path d="M 460 70 Q 466 65 472 70 Q 478 65 484 70"/>
  </g>

  <!-- Hazy horizon line -->
  <path d="M 0 220 Q 200 215 400 220 T 800 218" stroke="#FFFFFF" stroke-width="0.5" fill="none" opacity="0.4"/>
</svg>