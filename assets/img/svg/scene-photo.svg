<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="phBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E5E1E4"/>
      <stop offset="100%" stop-color="#CFC8CC"/>
    </linearGradient>
    <radialGradient id="phAlbum" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3A3640"/>
      <stop offset="100%" stop-color="#1A1820"/>
    </radialGradient>
    <radialGradient id="phEmpty" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#9CA4B0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7A8090" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <rect width="800" height="360" fill="url(#phBg)"/>

  <!-- Wooden table line -->
  <path d="M 0 320 L 800 320" stroke="#3A2A1A" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="400" cy="324" rx="280" ry="5" fill="#3A2A1A" opacity="0.1"/>

  <!-- Photo album (large book) -->
  <g transform="translate(240 90)">
    <!-- album shadow -->
    <ellipse cx="160" cy="244" rx="160" ry="6" fill="#000000" opacity="0.3"/>
    <!-- album cover (closed) -->
    <path d="M 0 20 L 320 0 L 320 230 L 0 250 Z" fill="url(#phAlbum)"/>
    <!-- spine -->
    <path d="M 0 20 L 320 0 L 320 6 L 0 26 Z" fill="#1A1820"/>
    <!-- album edge details -->
    <path d="M 0 20 L 0 250 L 4 250 L 4 22 Z" fill="#1A1820"/>
    <!-- page edge -->
    <path d="M 4 22 L 320 4 L 320 14 L 4 30 Z" fill="#F4ECDC" opacity="0.6"/>
  </g>

  <!-- Empty photo mounts ON TOP of album (slightly offset, mismatched) -->
  <g transform="translate(280 110)">
    <!-- top-left triangle mount -->
    <polygon points="20,40 20,60 40,40" fill="#5A5860"/>
    <polygon points="20,40 20,60 40,40" fill="none" stroke="#3A3640" stroke-width="0.5"/>
    <!-- top-right mount -->
    <polygon points="240,30 240,50 220,30" fill="#5A5860"/>
    <!-- bottom-left -->
    <polygon points="20,200 20,180 40,200" fill="#5A5860"/>
    <!-- bottom-right (offset) -->
    <polygon points="244,210 244,190 224,210" fill="#5A5860"/>
  </g>

  <!-- Empty photo rectangle (between mounts) -->
  <g transform="translate(310 130)">
    <rect x="0" y="0" width="180" height="140" fill="url(#phEmpty)" stroke="#A9B4C2" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"/>
    <!-- subtle inner shadow suggesting the absent image -->
    <rect x="6" y="6" width="168" height="128" fill="none" stroke="#A9B4C2" stroke-width="0.4" opacity="0.3"/>
    <!-- dust specks on the empty area -->
    <g fill="#A9B4C2" opacity="0.4">
      <circle cx="40" cy="40" r="0.6"/>
      <circle cx="120" cy="60" r="0.5"/>
      <circle cx="80" cy="100" r="0.5"/>
      <circle cx="150" cy="110" r="0.4"/>
    </g>
  </g>

  <!-- A second torn photo corner (peeking out, empty) -->
  <g transform="translate(560 60)" opacity="0.7">
    <polygon points="0,0 90,-8 100,80 8,90" fill="#F4ECDC" stroke="#A9B4C2" stroke-width="0.5"/>
    <polygon points="0,0 90,-8 100,80 8,90" fill="url(#phEmpty)" opacity="0.7"/>
  </g>

  <!-- Dust motes around the empty frame -->
  <g fill="#A9B4C2" opacity="0.5">
    <circle cx="280" cy="120" r="0.6"/>
    <circle cx="540" cy="200" r="0.7"/>
    <circle cx="610" cy="260" r="0.5"/>
    <circle cx="180" cy="280" r="0.5"/>
    <circle cx="660" cy="100" r="0.5"/>
  </g>

  <!-- Faint pencil inscription on album -->
  <g font-family="'Caveat', cursive" font-size="13" fill="#F4ECDC" opacity="0.4" transform="translate(280 300)">
    <text x="0" y="0">— nothing here.</text>
  </g>
</svg>