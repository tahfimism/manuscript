<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="drBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F8EDD8"/>
      <stop offset="100%" stop-color="#E8D8C0"/>
    </linearGradient>
    <linearGradient id="drLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="100%" stop-color="#F8B85C" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="drGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE680" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFE680" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="360" fill="url(#drBg)"/>

  <!-- Wall texture (subtle) -->
  <g stroke="#D0BFA0" stroke-width="0.3" opacity="0.3">
    <line x1="0" y1="60"  x2="800" y2="60"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
  </g>

  <!-- Floor -->
  <path d="M 0 300 L 800 300 L 800 360 L 0 360 Z" fill="#C8A878"/>
  <g stroke="#9A7048" stroke-width="0.4" opacity="0.5">
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="340" x2="800" y2="340"/>
  </g>
  <!-- Floor planks -->
  <g stroke="#9A7048" stroke-width="0.5" opacity="0.5">
    <line x1="100" y1="300" x2="100" y2="360"/>
    <line x1="240" y1="300" x2="240" y2="360"/>
    <line x1="380" y1="300" x2="380" y2="360"/>
    <line x1="520" y1="300" x2="520" y2="360"/>
    <line x1="660" y1="300" x2="660" y2="360"/>
  </g>

  <!-- Glow emanating from door crack -->
  <ellipse cx="400" cy="160" rx="180" ry="220" fill="url(#drGlow)"/>

  <!-- Door frame (large) -->
  <g transform="translate(340 50)">
    <!-- outer frame shadow -->
    <path d="M -8 0 L 128 0 L 132 12 L 128 252 L -8 252 L -12 12 Z" fill="#5A4030" opacity="0.4"/>
    <!-- frame -->
    <rect x="-4" y="-4" width="128" height="260" fill="#7A5840"/>
    <rect x="-4" y="-4" width="128" height="6" fill="#5A4030"/>
    <!-- inner frame -->
    <rect x="0" y="0" width="120" height="252" fill="#3A2A1A"/>
    <!-- light streaming out -->
    <rect x="2" y="2" width="116" height="248" fill="url(#drLight)"/>
    <!-- door, slightly ajar (tilted angle) -->
    <path d="M 14 248 L 14 6 L 100 14 L 100 248 Z" fill="#E3D5BC" stroke="#3A2A1A" stroke-width="1.4"/>
    <!-- door panels -->
    <rect x="22" y="22" width="68" height="60" fill="none" stroke="#7A5840" stroke-width="0.7"/>
    <rect x="22" y="100" width="68" height="60" fill="none" stroke="#7A5840" stroke-width="0.7"/>
    <rect x="22" y="178" width="68" height="60" fill="none" stroke="#7A5840" stroke-width="0.7"/>
    <!-- handle -->
    <circle cx="88" cy="148" r="2.4" fill="#3A2A1A"/>
    <!-- hinge line -->
    <path d="M 14 6 L 100 14" stroke="#3A2A1A" stroke-width="0.6" opacity="0.6"/>
    <!-- light beam out into floor -->
    <path d="M 14 248 L 100 248 L 130 256 L 100 252 L 14 252 Z" fill="url(#drLight)" opacity="0.85"/>
  </g>

  <!-- Small motif marks suggesting "beyond" -->
  <g fill="#5A4030" opacity="0.5">
    <circle cx="410" cy="100" r="0.8"/>
    <circle cx="390" cy="120" r="0.6"/>
    <circle cx="420" cy="80" r="0.5"/>
  </g>
</svg>